[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videomind"
version = "0.1.0"
description = "VideoMind — 视频理解 Agent 系统（求职作品集实现，Python 版）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VideoMind" }]
keywords = ["video", "rag", "agent", "whisper", "ocr", "fastapi"]

# ───────────────────────── 核心运行时依赖 ─────────────────────────
dependencies = [
    # Web / 接口层
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.12",
    # 配置与校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    # 持久化层
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "redis[hiredsync]>=5.2.0",
    # 向量 / 对象存储
    "qdrant-client[fastembed]>=1.12.0",
    "minio>=7.2.10",
    # 任务编排
    "celery[redis]>=5.4.0",
    # 视频处理基座
    "yt-dlp>=2024.10.7",
    "ffmpeg-python>=0.2.0",
    # AI 推理（双路径：API + 本地）
    "httpx>=0.27.0",                 # API 路径 HTTP 客户端
    "faster-whisper>=1.0.3",         # 本地 ASR 路径 (CTranslate2)
    # 本地 OCR 路径：paddleocr/paddlepaddle 见 [project.optional-dependencies].ocr
    # paddle 无 cp314 wheel → 放 extras，否则 uv sync 在 py3.14 解析失败（0 包装不上）
    "sentence-transformers>=3.2.0",  # 本地 Embedding 路径
    "rank-bm25>=0.2.2",             # RAG BM25 关键词检索
    "jieba>=0.42.1",                # CJK 分词（BM25 中文/日文检索混合分词）
    # 可观测性
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    # tracing.py 用 LoggingInstrumentor 配置结构化日志格式（漏声明则 import 时刻炸、靠 anaconda 残留遮）
    "opentelemetry-instrumentation-logging>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    # 工具
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",          # AES-GCM 字段加密
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis",
    # tests/core/video_pipeline/test_embed.py 属性测试在用；此前未声明，
    # 换环境即 ImportError（uv sync --extra dev 一次补齐）
    "hypothesis>=6.100.0",
]
gpu = [
    "torch>=2.4.0",
]
# 本地 OCR 路径（OCR_PROVIDER=local）：paddlepaddle wheel 仅 cp39–cp313，
# Python 3.14 无 wheel → 放 extras 避免主依赖解析失败（uv sync 卡死、装 0 包）。
# 装法：uv sync --extra ocr（需 Python ≤3.13）；不装则走 OCR_PROVIDER=api（ocr.space）
ocr = [
    "paddleocr>=2.8.0",
    "paddlepaddle>=2.6.0",
]

[project.urls]
Documentation = "https://github.com/yourname/videomind/docs"
Repository = "https://github.com/yourname/videomind"

[tool.hatch.build.targets.wheel]
packages = ["src/videomind"]

# ───────────────────────── 工具配置 ─────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: 需要真实基础设施的端到端测试",
    "infra: 需要真实基础设施的集成测试",
]

# ───────────────────────── 覆盖率（方向 2：core 层 80% 门槛）─────────────────────────
# 统计口径：core 层（业务核心：数据清洗/chunking/检索），branch 分支覆盖。
# 门槛在 CI 里由 --cov-fail-under=80 强制（本地 `pytest --cov --cov-fail-under=80` 同口径）
[tool.coverage.run]
source = ["src/videomind/core"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
ignore_missing_imports = true
