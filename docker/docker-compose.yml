# VideoMind 开发环境基础设施
# 仅含存储类服务（PostgreSQL / Redis / Qdrant / MinIO），不含应用容器。
# 应用层（FastAPI / Celery worker）在宿主机用 uv 直接跑，便于热重载与调试。
# 生产级完整编排（含 nginx/frontend/ollama/worker/monitoring）见 DEPLOYMENT.md。
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videomind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videomind}
      POSTGRES_DB: ${POSTGRES_DB:-videomind}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-videomind} -d ${POSTGRES_DB:-videomind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    # 对齐 .env 的 REDIS_URL/CELERY_BROKER_URL/CELERY_RESULT_BACKEND = localhost:16379
    # （.env 被运行中 API(8011) 持有，rebind 宿主端口成 16379 可免去重启 API）
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.8.0
    # 对齐 .env 的 QDRANT_URL = http://localhost:16333（REST/HTTP）
    # 代码仅用 AsyncQdrantClient(url=qdrant_url) REST，未用 gRPC(6334)，故只 rebind 6333
    ports:
      - "16333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  minio-data:
